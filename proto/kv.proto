syntax = "proto3";

package kv.api;

// Client-facing key/value API. Writes go through the Raft leader; followers
// answer with UNAVAILABLE and a `kv-leader` trailer naming the leader.
service KV {
  rpc Put(PutRequest) returns (WriteResponse);
  rpc Delete(DeleteRequest) returns (WriteResponse);
  rpc Write(WriteRequest) returns (WriteResponse);  // atomic multi-key batch
  rpc Get(GetRequest) returns (GetResponse);
  rpc Scan(ScanRequest) returns (ScanResponse);
}

service Admin {
  rpc Status(StatusRequest) returns (StatusResponse);
  rpc TransferLeadership(TransferLeadershipRequest) returns (TransferLeadershipResponse);
  rpc Snapshot(SnapshotRequest) returns (SnapshotResponse);
}

// Identifies a client session for exactly-once writes: the state machine
// remembers the last seq applied per client and turns retries into no-ops.
message Session {
  uint64 client_id = 1;
  uint64 seq = 2;
}

enum Consistency {
  LINEARIZABLE = 0;  // ReadIndex: leader confirms leadership with a quorum round
  LEASE = 1;         // leader serves from its lease without a round trip
  STALE = 2;         // any replica, possibly behind
}

message PutRequest {
  Session session = 1;
  bytes key = 2;
  bytes value = 3;
}

message DeleteRequest {
  Session session = 1;
  bytes key = 2;
}

message Op {
  enum Type {
    PUT = 0;
    DELETE = 1;
  }
  Type type = 1;
  bytes key = 2;
  bytes value = 3;
}

message WriteRequest {
  Session session = 1;
  repeated Op ops = 2;
}

message WriteResponse {
  uint64 index = 1;  // log index the write committed at
  uint64 term = 2;
}

message GetRequest {
  bytes key = 1;
  Consistency consistency = 2;
}

message GetResponse {
  bool found = 1;
  bytes value = 2;
  uint64 applied_index = 3;
}

message ScanRequest {
  bytes start = 1;
  bytes end = 2;  // exclusive; empty = unbounded
  uint32 limit = 3;
  Consistency consistency = 4;
}

message KeyValue {
  bytes key = 1;
  bytes value = 2;
}

message ScanResponse {
  repeated KeyValue items = 1;
}

message StatusRequest {}

message PeerStatus {
  uint32 id = 1;
  string address = 2;
  uint64 match_index = 3;
  uint64 next_index = 4;
  bool reachable = 5;
}

message StatusResponse {
  uint32 id = 1;
  string role = 2;  // leader | follower | candidate | standalone
  uint64 term = 3;
  uint32 leader_id = 4;
  string leader_address = 5;
  uint64 commit_index = 6;
  uint64 applied_index = 7;
  uint64 last_log_index = 8;
  uint64 snapshot_index = 9;
  uint64 keys = 10;
  repeated PeerStatus peers = 11;
}

message TransferLeadershipRequest {
  uint32 target_id = 1;  // 0 = most up-to-date follower
}

message TransferLeadershipResponse {
  uint32 new_leader_id = 1;
}

message SnapshotRequest {}

message SnapshotResponse {
  uint64 index = 1;
}
